name: Run Internship Scraper

on:
  schedule:
    # GitHub cron is UTC only; these map to ET during standard time
    # (they land an hour later during daylight saving).
    - cron: '0 13 * * *'  # 8 AM ET
    - cron: '0 19 * * *'  # 2 PM ET
    - cron: '0 1 * * *'   # 8 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run the scraper script
        id: scraper
        env:
          MY_EMAIL_ADDRESS: ${{ secrets.MY_EMAIL_ADDRESS }}
          MY_EMAIL_APP_PASSWORD: ${{ secrets.MY_EMAIL_APP_PASSWORD }}
          JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py

      # A scrape takes minutes, so main can move while it runs -- a code push,
      # or an overlapping run. Without this the auto-commit below is rejected
      # as non-fast-forward and the new seen_jobs.txt entries are lost, which
      # means the next run re-reports every one of those jobs.
      # autostash keeps the pending seen_jobs.txt change across the rebase.
      - name: Rebase onto any commits pushed during the run
        run: git -c rebase.autoStash=true pull --rebase origin ${{ github.ref_name }}

      - name: Commit and push updated seen_jobs.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update seen_jobs.txt with new internships"
          file_pattern: seen_jobs.txt
